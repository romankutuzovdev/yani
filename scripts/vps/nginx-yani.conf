# /etc/nginx/sites-available/yani
# HTTP → HTTPS + proxy to Next.js on 127.0.0.1:3000
# Cert paths filled by certbot or setup-https.sh

upstream yani_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name yani.by www.yani.by;

  # ACME challenge for Let's Encrypt
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name yani.by www.yani.by;

  ssl_certificate     /etc/letsencrypt/live/yani.by/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/yani.by/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 80m;

  location / {
    proxy_pass http://yani_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_buffering off;
  }
}
