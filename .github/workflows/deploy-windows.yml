name: Deploy to Windows server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: yani-windows-deploy
  # Do NOT cancel an in-flight deploy: it already stopped the app.
  # Cancelling mid-way leaves the site down.
  cancel-in-progress: false

jobs:
  deploy:
    name: Update Yani on Windows
    runs-on: [self-hosted, Windows, yani]
    timeout-minutes: 45
    steps:
      - name: Pull, rebuild, restart
        shell: powershell
        working-directory: C:\apps\yani
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "C:\apps\yani\package.json")) {
            throw "C:\apps\yani not found. Clone the repo there first (see DEPLOY-WINDOWS.md)."
          }

          Write-Host "==> Syncing git to origin/main..."
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { throw "git reset failed" }

          Write-Host "==> Running deploy.ps1 (-SkipGit)..."
          powershell -ExecutionPolicy Bypass -File .\scripts\windows\deploy.ps1 -SkipGit
          if ($LASTEXITCODE -ne 0) { throw "deploy.ps1 failed" }

      - name: Ensure site is up (recovery)
        if: failure()
        shell: powershell
        working-directory: C:\apps\yani
        run: |
          Write-Host "==> Deploy failed - emergency start of existing build..." -ForegroundColor Yellow
          powershell -ExecutionPolicy Bypass -File .\scripts\windows\stop.ps1
          Start-Sleep -Seconds 2
          if (-not (Test-Path ".\.next")) {
            if (Test-Path ".\.next-prev") {
              Copy-Item ".\.next-prev" ".\.next" -Recurse -Force
              Write-Host "Restored .next from .next-prev"
            } else {
              throw "No .next or .next-prev - cannot recover automatically"
            }
          }
          $logDir = ".\data\logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          Start-Process powershell.exe `
            -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-File",".\scripts\windows\start.ps1" `
            -WorkingDirectory (Get-Location).Path `
            -WindowStyle Hidden `
            -RedirectStandardOutput (Join-Path $logDir "recovery-$stamp.out.log") `
            -RedirectStandardError (Join-Path $logDir "recovery-$stamp.err.log")
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try {
              if (Get-NetTCPConnection -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue) {
                $ok = $true
                break
              }
            } catch {}
          }
          if (-not $ok) { throw "Emergency start failed - site still down on 8080" }
          Write-Host "Emergency recovery OK: http://91.149.133.54:8080/chat" -ForegroundColor Green
